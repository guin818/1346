<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lesson 19 재시험 단어 테스트기</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .quiz-container { 
            background-color: white; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            padding: 25px 20px; 
            width: 100%; 
            max-width: 480px; 
            text-align: center; 
            box-sizing: border-box; 
        }
        .mode-container { 
            display: flex; 
            background-color: #eef2f7; 
            padding: 4px; 
            border-radius: 30px; 
            margin-bottom: 20px; 
        }
        .mode-btn { 
            flex: 1; 
            border: none; 
            background: none; 
            padding: 10px; 
            font-size: 14px; 
            font-weight: bold; 
            color: #7f8c8d; 
            cursor: pointer; 
            border-radius: 25px; 
            transition: all 0.2s;
        }
        .mode-btn.active { 
            background-color: #34495E; 
            color: white; 
        }
        .progress { 
            font-size: 15px; 
            font-weight: bold; 
            color: #888; 
            margin-bottom: 15px; 
        }
        .question-box { 
            background-color: #eef2f7; 
            padding: 20px 15px; 
            border-radius: 12px; 
            min-height: 130px; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            font-size: 16px; 
            color: #2c3e50; 
            line-height: 1.6; 
            word-break: keep-all;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }
        .definition {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2980b9;
            width: 100%;
        }
        .example {
            font-style: italic;
            color: #34495E;
            width: 100%;
        }
        .audio-buttons-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }
        .audio-btn { 
            background-color: #4A90E2; 
            color: white; 
            border: none; 
            padding: 10px 12px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: bold; 
            flex: 1; 
            transition: background 0.2s;
        }
        .audio-btn:hover { background-color: #357abd; }
        .audio-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .listen-count {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 6px;
            font-weight: bold;
        }
        .answer-box { 
            margin: 20px 0; 
            min-height: 50px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .answer-text { 
            font-size: 22px; 
            font-weight: bold; 
            color: #e74c3c; 
            display: none; 
            white-space: pre-line; 
        }
        .btn { 
            border: none; 
            font-weight: bold; 
            border-radius: 10px; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            transition: background 0.2s;
        }
        .btn-show { 
            background-color: #2ECC71; 
            color: white; 
            width: 100%; 
            margin-bottom: 15px; 
            min-height: 52px; 
            font-size: 17px; 
        }
        .btn-show:hover { background-color: #27ae60; }
        
        .score-buttons { 
            display: none; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 6px; 
            margin-bottom: 15px; 
        }
        .btn-small { 
            font-size: 11px; 
            padding: 8px 2px; 
            min-height: 36px; 
            color: white; 
        }
        .nav-buttons { 
            display: flex; 
            justify-content: space-between; 
            gap: 12px; 
        }
        .btn-nav { 
            background-color: #34495E; 
            color: white; 
            flex: 1; 
            min-height: 52px; 
            font-size: 17px; 
        }
        .btn-nav:hover { background-color: #2c3e50; }
        .btn-nav:disabled { background-color: #d2d7d9; color: #95a5a6; cursor: not-allowed; }
        .result-screen { display: none; }
        .result-title { font-size: 26px; color: #2c3e50; margin-bottom: 20px; font-weight: bold; }
        .score-text { font-size: 32px; color: #2c3e50; font-weight: bold; margin-bottom: 10px; background-color: #eef2f7; padding: 15px; border-radius: 12px; }
        .wrong-detail { font-size: 16px; color: #7f8c8d; margin-bottom: 30px; }
        .btn-restart { background-color: #9b59b6; color: white; width: 100%; min-height: 52px; font-size: 17px; }
        .btn-restart:hover { background-color: #8e44ad; }
    </style>
</head>
<body>
<div class="quiz-container">
    <div class="mode-container">
        <button class="mode-btn active" id="modeStudent" onclick="changeMode('student')">학생용 모드</button>
        <button class="mode-btn" id="modeParent" onclick="changeMode('parent')">부모용 모드</button>
    </div>

    <div id="quiz-area">
        <div class="progress" id="progress">0 / 0</div>
        <div class="question-box" id="question">
            <div class="definition" id="qDef">영영 뜻</div>
            <div class="example" id="qEx">예문</div>
        </div>
        
        <div>
            <div class="audio-buttons-group">
                <button class="audio-btn" id="audioDefBtn" onclick="speakText('def')">🔊 데피니션 듣기</button>
                <button class="audio-btn" id="audioExBtn" onclick="speakText('ex')">🔊 예문 듣기</button>
            </div>
            <div class="listen-count" id="listenCount">남은 예문 듣기 횟수: 2회</div>
        </div>
        
        <div class="answer-box">
            <div class="answer-text" id="answer">정답 단어 : 뜻</div>
        </div>
        
        <button class="btn btn-show" id="showAnswerBtn" onclick="showAnswer()">정답 보기</button>
        
        <div class="score-buttons" id="scoreButtons">
            <button class="btn btn-small" style="background-color: #2c3e50;" onclick="recordScore('both_ok')">둘 다 맞음</button>
            <button class="btn btn-small" style="background-color: #2980b9;" onclick="recordScore('eng_ok')">영만 맞음</button>
            <button class="btn btn-small" style="background-color: #27ae60;" onclick="recordScore('kor_ok')">한만 맞음</button>
            <button class="btn btn-small" style="background-color: #7f8c8d;" onclick="recordScore('both_no')">둘 다 틀림</button>
            <button class="btn btn-small" style="background-color: #d35400;" onclick="recordScore('kor_no')">한만 틀림</button>
            <button class="btn btn-small" style="background-color: #c0392b;" onclick="recordScore('eng_no')">영만 틀림</button>
        </div>
        
        <div class="nav-buttons">
            <button class="btn btn-nav" id="prevBtn" onclick="prevQuestion()">이전</button>
            <button class="btn btn-nav" id="nextBtn" onclick="nextQuestion()">다음</button>
        </div>
    </div>

    <div id="result-area" class="result-screen">
        <div class="result-title">💯 재시험 대비 학습 종료</div>
        <div class="score-text" id="finalScore">총 틀린 개수: 0개</div>
        <div class="wrong-detail" id="wrongDetail">상세 결과 준비 중</div>
        <button class="btn btn-restart" onclick="restartQuiz()">다시 처음부터 하기</button>
    </div>
</div>

<script>
    const originalWords = [
        { word: "extremely", mean: "극도로", desc: "very; to an extreme degree", ex: "[I did extremely well on that last quiz.]" },
        { word: "replace", mean: "대신하다", desc: "to put something in the place of another thing", ex: "[We need to replace our old refrigerator.]" },
        { word: "press", mean: "누르다", desc: "to put pressure on something, often with one's hands", ex: "[The doctor pressed the patient's stomach.]" },
        { word: "razor", mean: "면도기", desc: "a tool with a very sharp blade that is used for cutting hair close to the skin", ex: "[Tom shaves his face with an electric razor.]" },
        { word: "equipment", mean: "장비", desc: "anything made for a particular use", ex: "[We bought a lot of new equipment for our hiking trip, including a tent.]" },
        { word: "daydream", mean: "백일몽", desc: "a pleasant or exciting story or event that someone who is awake imagines is happening to them", ex: "[All during class, I had daydreams about summer vacation.]" },
        { word: "receipt", mean: "영수증", desc: "a piece of paper showing that money or things were received", ex: "[The cashier at the store gave me my change and a receipt.]" },
        { word: "local", mean: "지역의", desc: "having to do with a particular place such as a neighborhood or town", ex: "[They called the local police for help.]" },
        { word: "nod", mean: "끄덕이다", desc: "to move the head up and down in order to greet or agree with someone", ex: "[Nancy nodded when her son asked if she could have a cookie.]" },
        { word: "fairly", mean: "공정하게, 상당히", desc: "to a degree that is not high but not low", ex: "[She is doing fairly well in school.]" },
        { word: "prevent", mean: "막다", desc: "to keep or stop from happening", ex: "[Washing your hands can help prevent illness.]" },
        { word: "interrupt", mean: "방해하다", desc: "to cause to stop; break off", ex: "[Loud banging on the door interrupted the conversation.]" },
        { word: "suction", mean: "흡입", desc: "the force that pulls or draws an object or liquid into a vacuum", ex: "[The suction of the vacuum cleaner is blocked.]" },
        { word: "tablet", mean: "알약", desc: "a small, flat, round piece of medicine", ex: "[The doctor said to take two tablets before meals.]" },
        { word: "surgery", mean: "수술", desc: "the field of medicine that treats disease and injury by fixing or removing parts of the body", ex: "[He is going to have surgery for the torn muscle in his leg.]" },
        { word: "bud", mean: "싹", desc: "a swelling on a plant that can grow into new parts, such as leaves or a flower", ex: "[It was early spring, and buds were beginning to appear on the bushes and trees.]" },
        { word: "explain", mean: "설명하다", desc: "to give information so that another person can understand something", ex: "[The teacher explained the directions to the students.]" },
        { word: "belonging", mean: "소유물", desc: "things that are owned by a person; possessions", ex: "[Nell packed all of her belongings and moved out of the apartment.]" },
        { word: "settlement", mean: "해결", desc: "an agreement", ex: "[They reached a settlement that satisfied both of them.]" },
        { word: "lonely", mean: "외로운", desc: "without company; alone", ex: "[If you feel lonely, call a friend.]" }
    ];

    let currentWords = [];
    let currentIndex = 0;
    let userAnswers = [];
    let currentMode = 'student';
    let listenCounts = [];
    let isMovingBackwards = false;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initQuiz() {
        currentWords = shuffle([...originalWords]);
        currentIndex = 0;
        userAnswers = new Array(currentWords.length).fill(null);
        listenCounts = new Array(currentWords.length).fill(0);
    }

    function changeMode(mode) {
        currentMode = mode;
        document.getElementById('modeStudent').classList.toggle('active', mode === 'student');
        document.getElementById('modeParent').classList.toggle('active', mode === 'parent');
        updateQuiz();
    }

    function getBlankedExample(item) {
        let ex = item.ex;
        let reg = new RegExp(item.word, 'gi');
        return ex.replace(reg, "[ ____ ]");
    }

    function updateQuiz() {
        const current = currentWords[currentIndex];
        document.getElementById('progress').innerText = (currentIndex + 1) + " / " + currentWords.length;
        
        document.getElementById('qDef').innerText = "💡 뜻: " + current.desc;

        if (currentMode === 'student') {
            document.getElementById('qEx').innerText = "문장: " + getBlankedExample(current);
            document.getElementById('audioDefBtn').innerText = '🔊 데피니션 듣기';
            document.getElementById('audioExBtn').innerText = '🔊 예문 듣기';
            document.getElementById('listenCount').style.display = 'block';
            
            const remaining = Math.max(0, 2 - listenCounts[currentIndex]);
            document.getElementById('listenCount').innerText = `남은 예문 듣기 횟수: ${remaining}회`;
            document.getElementById('audioExBtn').disabled = isMovingBackwards || remaining <= 0;
            document.getElementById('audioDefBtn').disabled = false;
        } else {
            document.getElementById('qEx').innerText = "문장: " + current.ex;
            document.getElementById('audioDefBtn').innerText = '🔊 데피니션 듣기';
            document.getElementById('audioExBtn').innerText = '🔊 단어 발음 듣기';
            document.getElementById('listenCount').style.display = 'none';
            document.getElementById('audioDefBtn').disabled = false;
            document.getElementById('audioExBtn').disabled = false;
        }
        
        document.getElementById('answer').innerText = "정답: " + current.word + "\n뜻: " + current.mean;
        
        if (userAnswers[currentIndex] !== null) {
            document.getElementById('answer').style.display = 'block';
            document.getElementById('showAnswerBtn').style.display = 'none';
            document.getElementById('scoreButtons').style.display = 'grid';
        } else {
            document.getElementById('answer').style.display = 'none';
            document.getElementById('showAnswerBtn').style.display = 'flex';
            document.getElementById('scoreButtons').style.display = 'none';
        }
        
        document.getElementById('prevBtn').disabled = currentIndex === 0;
        if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
        isMovingBackwards = false;
    }

    function speakText(type) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let textToSpeak = "";
            const current = currentWords[currentIndex];
            
            if (type === 'def') {
                textToSpeak = current.desc;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            } else if (type === 'ex') {
                if (currentMode === 'student') {
                    listenCounts[currentIndex]++;
                    const remaining = Math.max(0, 2 - listenCounts[currentIndex]);
                    document.getElementById('listenCount').innerText = `남은 예문 듣기 횟수: ${remaining}회`;
                    if (remaining <= 0) { document.getElementById('audioExBtn').disabled = true; }
                    
                    // 학생 모드 예문 듣기: 정답 단어 부근에서 '삐' 소리로 대체하기 위해 단어 기준 앞뒤로 나눠서 읽기
                    let fullEx = current.ex;
                    let reg = new RegExp(current.word, 'i');
                    let match = fullEx.match(reg);
                    
                    if (match) {
                        let splitIndex = match.index;
                        let part1 = fullEx.substring(0, splitIndex);
                        let part2 = fullEx.substring(splitIndex + current.word.length);
                        
                        let utter1 = new SpeechSynthesisUtterance(part1);
                        utter1.lang = 'en-US';
                        utter1.rate = 0.85;
                        
                        let beep = new SpeechSynthesisUtterance("beep");
                        beep.lang = 'en-US';
                        beep.rate = 1.2;
                        beep.pitch = 1.5; // 높은 삐 소리 느낌
                        
                        let utter2 = new SpeechSynthesisUtterance(part2);
                        utter2.lang = 'en-US';
                        utter2.rate = 0.85;
                        
                        window.speechSynthesis.speak(utter1);
                        window.speechSynthesis.speak(beep);
                        window.speechSynthesis.speak(utter2);
                    } else {
                        let utterance = new SpeechSynthesisUtterance(fullEx);
                        utterance.lang = 'en-US';
                        utterance.rate = 0.85;
                        window.speechSynthesis.speak(utterance);
                    }
                } else {
                    // 부모 모드에서는 전체 예문 그대로 읽기
                    let utterance = new SpeechSynthesisUtterance(current.ex);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.85;
                    window.speechSynthesis.speak(utterance);
                }
            }
        }
    }

    function showAnswer() {
        document.getElementById('answer').style.display = 'block';
        document.getElementById('showAnswerBtn').style.display = 'none';
        document.getElementById('scoreButtons').style.display = 'grid';
    }

    function recordScore(type) {
        userAnswers[currentIndex] = type;
        if (currentIndex < currentWords.length - 1) {
            currentIndex++;
            updateQuiz();
        } else {
            showFinalResult();
        }
    }

    function showFinalResult() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        
        let totalWrongCount = 0;
        let halfWrong = 0;
        let fullWrong = 0;
        
        userAnswers.forEach(type => {
            if (type === 'both_no') { totalWrongCount += 1.0; fullWrong++; } 
            else if (['eng_ok', 'kor_ok', 'kor_no', 'eng_no'].includes(type)) { totalWrongCount += 0.5; halfWrong++; }
        });
        
        document.getElementById('finalScore').innerText = "총 틀린 개수: " + totalWrongCount + "개";
        document.getElementById('wrongDetail').innerText = "(둘 다 틀림: " + fullWrong + "개 / 한쪽만 틀림: " + halfWrong + "개)";
    }

    function prevQuestion() {
        if (currentIndex > 0) { currentIndex--; isMovingBackwards = true; updateQuiz(); }
    }

    function nextQuestion() {
        if (currentIndex < currentWords.length - 1) { currentIndex++; isMovingBackwards = false; updateQuiz(); } 
        else { showFinalResult(); }
    }

    function restartQuiz() {
        initQuiz();
        document.getElementById('quiz-area').style.display = 'block';
        document.getElementById('result-area').style.display = 'none';
        updateQuiz();
    }

    window.onload = function() { initQuiz(); updateQuiz(); };
</script>
</body>
</html>
